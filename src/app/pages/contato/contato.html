<header class="header">

    <h1>Farmácia Vida+</h1>

    <nav>
        <a routerLink="/">Início</a>
        <a routerLink="/produtos">Produtos</a>
        <a routerLink="/carrinho">Carrinho</a>
        <a routerLink="/contato">Contato</a>
        <a routerLink="/login">Login</a>
    </nav>

</header>

<!-- CONTATO -->
<div class="contato-container">

    <div class="contato-card">

        <h2>Contato</h2>

        <form class="contato-form" (ngSubmit)="enviar()">

            <div class="campo">

                <input 
                    type="text" 
                    placeholder="Nome" 
                    [(ngModel)]="nome"
                    name="nome"
                    required
                >

            </div>

            <div class="campo">

                <input 
                    type="email" 
                    placeholder="Email" 
                    [(ngModel)]="email"
                    name="email"
                    required
                >

            </div>

            <div class="campo">

                <textarea 
                    placeholder="Mensagem"
                    [(ngModel)]="mensagem"
                    name="mensagem"
                    required
                ></textarea>

            </div>

            <div class="campo">

                <button type="submit">
                    Enviar
                </button>

            </div>

        </form>

    </div>

</div>

<!-- FOOTER -->
<footer>

    <div class="footer-container">

        <div class="footer-content">

            <div>
                <h3>Sobre</h3>
                <p>Farmácia confiável com entrega rápida.</p>
            </div>

            <div>
                <h3>Atendimento</h3>
                <p>08h às 22h</p>
            </div>

            <div>
                <h3>Contato</h3>
                <p>contato@farmacia.com</p>
            </div>

        </div>

        <div class="footer-copy">
            © 2026 Farmácia Vida+
        </div>

    </div>

</footer>
